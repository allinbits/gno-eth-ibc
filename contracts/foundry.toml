[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@eureka/=lib/solidity-ibc-eureka/contracts/",
]

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true
